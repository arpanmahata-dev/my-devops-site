<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My DevOps Site</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-900 via-slate-900 to-sky-900
             flex flex-col items-center justify-center text-white p-8">

  <div class="text-6xl mb-6">🚀</div>

  <h1 class="text-5xl font-extrabold mb-4
             bg-gradient-to-r from-indigo-400 to-sky-400
             bg-clip-text text-transparent">
    Hello, DevOps World!
  </h1>

  <p class="text-slate-300 text-lg mb-8 max-w-md text-center">
    Automatically deployed via
    <strong class="text-indigo-400">GitHub Actions</strong> →
    <strong class="text-sky-400">AWS S3</strong>
  </p>

  <div class="flex gap-3">
    <span class="bg-indigo-500/20 border border-indigo-500/40
                 text-indigo-300 px-4 py-1 rounded-full text-sm">
      ✅ CI Passed
    </span>
    <span class="bg-green-500/20 border border-green-500/40
                 text-green-300 px-4 py-1 rounded-full text-sm">
      🚀 Deployed
    </span>
  </div>

  <div class="mt-12 text-slate-500 text-sm">
    Last deployed: <span id="ts"></span>
  </div>

  <script>
    document.getElementById('ts').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
