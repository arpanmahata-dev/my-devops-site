name: Deploy to AWS S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔍 CHANGED: Look inside the subfolder!
      - name: Validate HTML file exists
        run: |
          echo "Checking files in subfolder..."
          test -f my-devops-site/index.html && echo "index.html found ✅" || exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 🚀 CHANGED: Sync contents of my-devops-site folder to S3 root
      - name: Deploy to S3
        run: |
          aws s3 sync my-devops-site/ s3://${{ secrets.AWS_S3_BUCKET }} --delete