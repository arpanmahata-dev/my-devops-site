name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Get the code
      - name: Checkout
        uses: actions/checkout@v4

      # 🧪 Basic CI check
      - name: Validate HTML
        run: test -f index.html && echo "✅ index.html found"

      # 🔐 Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 Build & push the image
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-site:latest

      # 🚀 SSH to EC2 and redeploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-site:latest
            docker stop my-site || true
            docker rm my-site || true
            docker run -d -p 80:80 --name my-site \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/my-site:latest